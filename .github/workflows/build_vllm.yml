name: Build Intel LLM Scaler

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b70-scaler-release
  cancel-in-progress: false

env:
  IMAGE: docker.io/kyuz0/intel-b70-vllm-toolbox

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner build space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: toolboxes
          file: toolboxes/Dockerfile.llm-scaler-vllm
          platforms: linux/amd64
          load: true
          tags: b70-scaler:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify Python stack and runtime identities
        run: |
          docker run --rm b70-scaler:candidate python3 -c 'import importlib.metadata as m; assert m.version("vllm").split("+")[0] == "0.26.1.dev0", m.version("vllm"); print("vLLM", m.version("vllm"))'
          docker run --rm b70-scaler:candidate cat /opt/b70-provenance/packages.txt
      - name: Publish immutable and channel tags
        run: |
          docker tag b70-scaler:candidate "$IMAGE:latest-${GITHUB_SHA}"
          docker push "$IMAGE:latest-${GITHUB_SHA}"
          docker tag b70-scaler:candidate "$IMAGE:latest"
          docker push "$IMAGE:latest"
