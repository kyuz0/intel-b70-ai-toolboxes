name: Build Flash Next SYCL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b70-flash-next-release
  cancel-in-progress: false

env:
  IMAGE: docker.io/kyuz0/intel-b70-ai-toolboxes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Free runner build space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build candidate
        uses: docker/build-push-action@v6
        with:
          context: toolboxes
          file: toolboxes/Dockerfile.sycl-flash-next
          platforms: linux/amd64
          load: true
          tags: b70-flash-next:candidate
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify package and linked runtime
        # This pinned SYCL binary initializes a GPU even for --help/version.
        # Actual execution is qualified separately on two B70 GPUs.
        run: |
          docker run --rm b70-flash-next:candidate bash -ec 'test -x /usr/local/bin/llama-server; test -x /usr/local/bin/llama-bench; ldd /usr/local/bin/llama-server > /tmp/linked; cat /tmp/linked; ! grep -q "not found" /tmp/linked; test "$(cat /opt/b70-provenance/source.txt)" = 52d42686560a9e8f441f9b9780c8890c37d2802d; test -s /opt/b70-provenance/source.patch'
      - name: Publish immutable and channel tags
        run: |
          docker tag b70-flash-next:candidate "$IMAGE:sycl-flash-next-${GITHUB_SHA}"
          docker push "$IMAGE:sycl-flash-next-${GITHUB_SHA}"
          docker tag b70-flash-next:candidate "$IMAGE:sycl-flash-next"
          docker push "$IMAGE:sycl-flash-next"
